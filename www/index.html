<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vocabulator — Flashcards</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f6f5f2" />
  <meta name="description" content="Learn vocabulary with the 5-box Leitner spaced-repetition system." />

  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vocabulator" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1>Vocabulator</h1>
      <button id="menuBtn" class="menu-btn" type="button" aria-label="Menu">☰</button>
    </div>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div id="menuPanel" class="menu-panel" hidden>
    <div class="menu-section">
      <div class="menu-label">Language</div>
      <div id="languageMenuItems" class="menu-lang-list"></div>
    </div>
    <div class="menu-section">
      <div class="menu-label">Progress</div>
      <div class="boxes-overview" id="boxesOverview"></div>
    </div>
    <div class="menu-section">
      <button id="menuManageBtn" class="menu-item" type="button">Manage Cards</button>
    </div>
  </div>

  <main>
    <section id="view-study" class="view active">
      <button id="filtersToggleBtn" class="filters-toggle" type="button"></button>
      <div class="cats" id="catFilter"></div>
      <div class="direction-toggle" id="directionToggle"></div>

      <div id="studyArea">
        <div id="noCards" class="empty-state" hidden>
          <p id="noCardsText"></p>
        </div>

        <div id="card" class="flashcard" hidden>
          <div class="card-meta">
            <span id="cardCat" class="cat-tag"></span>
            <span id="cardBoxLabel" class="badge"></span>
            <button id="markBtn" class="mark-btn" type="button" aria-label="Mark word">☆</button>
          </div>
          <div class="card-front">
            <div class="text-row">
              <p id="cardFront"></p>
              <button id="speakFrontBtn" class="speak-btn" type="button" aria-label="Play pronunciation" hidden>🔊</button>
            </div>
            <p id="cardFrontPron" class="pron" hidden></p>
            <p id="cardFrontDu" class="du-form" hidden></p>
          </div>
          <div class="card-back" id="cardBackWrap" hidden>
            <div class="text-row">
              <p id="cardBack"></p>
              <button id="speakBackBtn" class="speak-btn" type="button" aria-label="Play pronunciation" hidden>🔊</button>
            </div>
            <p id="cardPron" class="pron"></p>
            <p id="cardDu" class="du-form" hidden></p>
            <p id="cardLit" class="literal"></p>
          </div>

          <div class="card-actions">
            <button id="showAnswerBtn" class="btn primary">Show answer</button>
            <div id="judgeButtons" class="judge-buttons" hidden>
              <button id="wrongBtn" class="btn danger">✗ Didn't know it</button>
              <button id="correctBtn" class="btn success">✓ Knew it</button>
            </div>
          </div>

          <div class="card-counter" id="cardCounter"></div>
        </div>
      </div>
    </section>

    <section id="view-manage" class="view">
      <button id="backToStudyLink" class="back-link" type="button">← Study</button>
      <input id="manageSearchInput" class="manage-search" type="search" placeholder="Search words..." />
      <div class="cats" id="manageLangFilter"></div>
      <div class="cats" id="manageCatFilter"></div>
      <button id="addCardBtn" class="btn primary add-card-btn" type="button">+ Add card</button>
      <div id="cardList" class="card-list"></div>
    </section>
  </main>

  <script src="data/rw-seed.js"></script>
  <script src="data/de-a1-seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
